name: Gerät melden / Report a device
description: Ein Gerät tut nicht, was es soll — mit Diagnosebericht / A device does not do what it should — with a diagnostics report
title: "[Gerät] Modell — kurz beschreiben"
labels: ["device-support"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für deinen Bericht! Mit dem Diagnosebericht sehen wir, was dein Gerät kann und was es geantwortet hat — meist ohne Rückfrage.

        Thanks for the report! The diagnostics report shows what your device can do and what it answered — usually without a follow-up question.

  - type: input
    id: model
    attributes:
      label: Modell (optional) / Model (optional)
      description: Steht auch im Diagnosebericht. / Also part of the diagnostics report.

  - type: textarea
    id: behavior
    attributes:
      label: Was funktioniert nicht? / What does not work?
      description: |
        Was hast du gemacht, was hast du erwartet, was ist passiert? Welcher Datenpunkt?

        What did you do, what did you expect, what happened? Which datapoint?
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnosebericht / Diagnostics report
      description: |
        In den Instanz-Einstellungen: Reiter **Experte** → Gerät wählen → **Diagnosebericht erstellen**, dann die heruntergeladene Datei hier hineinziehen. Am besten direkt nach dem Fehler — der Bericht enthält auch, was davor passiert ist, und die letzten Logzeilen. Adressen, Seriennummern, Netzwerk- und Raumnamen sind ersetzt.

        In the instance settings: tab **Expert** → pick the device → **Create diagnostics report**, then drag the downloaded file in here. Best right after the problem — the report also holds what happened before it and the recent log lines. Addresses, serial numbers, network and room names are replaced.
    validations:
      required: true

  - type: input
    id: adapter-version
    attributes:
      label: Adapter-Version / Adapter version
      description: Reiter Instanzen / Instances tab
      placeholder: "x.y.z"
    validations:
      required: true

  - type: textarea
    id: extras
    attributes:
      label: Sonstiges (optional) / Anything else (optional)
      description: |
        Bildschirmfotos, Firmware, Besonderheiten deiner Installation.

        Screenshots, firmware, peculiarities of your setup.
