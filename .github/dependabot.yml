# Dependabot configuration
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '36 2 4 * *'
    open-pull-requests-limit: 15
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # The lint chain (@iobroker/eslint-config -> typescript-eslint) caps TypeScript below 6.1,
      # so every TypeScript major bump would fail.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  # src-admin (admin sign-in component, Module Federation): hand-pinned compatibility matrix
  # (React / MUI / @module-federation/vite). This entry only covers the non-root package.json
  # (repochecker W8905); ignoring every dependency keeps the pinned matrix untouched.
  - package-ecosystem: 'npm'
    directory: '/src-admin'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '36 2 4 * *'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '36 2 4 * *'
    open-pull-requests-limit: 15
