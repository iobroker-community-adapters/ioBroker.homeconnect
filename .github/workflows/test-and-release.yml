name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      # `developing` is where the work happens and `master` is the release branch, so
      # both have to be tested. Without developing, a change is first seen by a Windows
      # runner when the release tag is already pushed.
      - "master"
      - "developing"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"

  pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: "24.x"
          type-checking: true
          lint: true

  # Builds, type-checks and tests the admin sign-in component (src-admin). The build
  # calls vite directly, so the component's own TypeScript never runs anywhere else.
  admin-component:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    needs: [check-and-lint]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - name: Build the admin custom component (Vite / Module Federation)
        run: npm run build:admin
      - name: Type-check and test the component with its own TypeScript and vitest
        run: npm run test:admin

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    needs: [check-and-lint]

    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          build: true

  # Deploys the final package to NPM
  deploy:
    needs: [check-and-lint, adapter-tests, admin-component]

    # Trigger this step only when a commit on any branch is tagged with a version number
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    # Write permissions are required to create GitHub releases
    # id-token is required for npm Trusted Publishing
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: "26.x"
          build: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
